{% extends "base.html" %}
{% block content %}
<div class="header-row">
    <h2>Ayarlar</h2>
</div>

<div class="card">
    <h3>Uygulama</h3>
    <div class="links">
        <a class="button-link" href="{{ url_for('download_apk') }}">APK Uygulama İndir</a>
        <button type="button" id="addToHomeBtn">Ana Ekrana Kısayol</button>
    </div>
    <p id="addToHomeHelp" style="margin-top:10px; color:#555;"></p>
</div>

<div class="card">
    <h3>Profil Ayarları</h3>
    <div class="links">
        <a class="button-link" href="{{ url_for('profile') }}">Profil Bilgileri</a>
    </div>
</div>

<div class="card">
    <h3>Yedekleme</h3>
    <div class="links">
        <a class="button-link" href="{{ url_for('export_reports_csv', year=selected_year, period=period_value) }}">Dışa Aktar (CSV)</a>
    </div>
    <form method="post" action="{{ url_for('import_reports_backup') }}" enctype="multipart/form-data" class="import-form" style="margin-top:10px;">
        <input type="hidden" name="back" value="settings">
        <input type="file" name="backup_file" accept=".json,application/json,text/json" required>
        <button type="submit">İçe Aktar</button>
    </form>
</div>

<div class="card" id="change-password">
    <h3>Şifre Değiştir</h3>
    <form method="post" class="grid two-col">
        <input type="hidden" name="action" value="change_password">
        <label>Eski Şifre
            <input type="password" name="old_password" required>
        </label>
        <label>Yeni Şifre
            <input type="password" name="new_password" required>
        </label>
        <label>Yeni Şifre (Tekrar)
            <input type="password" name="new_password_confirm" required>
        </label>
        <div class="entry-spacer" aria-hidden="true"></div>
        <button type="submit" class="full">Tamam</button>
    </form>
</div>

<script>
(() => {
    const btn = document.getElementById("addToHomeBtn");
    const help = document.getElementById("addToHomeHelp");
    if (!btn) return;

    let deferredPrompt = null;
    const ua = navigator.userAgent || "";
    const isIos = /iPhone|iPad|iPod/i.test(ua);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    function setHelp(text) {
        if (help) help.textContent = text || "";
    }

    if (isStandalone) {
        btn.disabled = true;
        setHelp("Kısayol zaten ana ekrana eklendi.");
        return;
    }

    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setHelp("Kısayol hazır. Butona basarak ana ekrana ekleyebilirsiniz.");
    });

    btn.addEventListener("click", async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            try {
                await deferredPrompt.userChoice;
            } catch (_e) {
                // no-op
            }
            deferredPrompt = null;
            return;
        }

        if (isIos) {
            alert("iPhone/Safari: Paylaş simgesine dokunun, sonra 'Ana Ekrana Ekle' seçin.");
            setHelp("iPhone için Safari'de Paylaş > Ana Ekrana Ekle adımlarını kullanın.");
            return;
        }

        alert("Tarayıcı bu işlem için doğrudan pencere açmıyor. Menüden 'Ana ekrana ekle' seçeneğini kullanın.");
    });
})();
</script>

{% endblock %}
