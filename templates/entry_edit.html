{% extends "base.html" %}
{% block content %}
<div class="header-row">
    <h2>Kayıt Düzenle</h2>
</div>

<div class="card">
    <h3>Mesai Girişi</h3>
    <form method="post" action="{{ url_for('edit_entry', entry_id=entry.id) }}" class="grid two-col entry-form mobile-entry-form" id="editForm">
        <input type="hidden" name="back" value="{{ back }}">
        <label>Tarih
            <input type="date" class="picker-only-dt" name="work_date" id="work_date" value="{{ entry.work_date.isoformat() }}" required autocomplete="off">
        </label>
        <div class="entry-spacer" aria-hidden="true"></div>
        <label>Başlama
            <input type="time" class="picker-only-dt" name="start_time" id="start_time" value="{{ entry.start_time }}" required autocomplete="off" step="60">
        </label>
        <label>Bitiş
            <input type="time" class="picker-only-dt" name="end_time" id="end_time" value="{{ entry.end_time }}" required autocomplete="off" step="60">
        </label>
        <label>%60
            <input name="pct60" id="pct60" placeholder="0" value="{{ fmt_num(entry.pct60) }}">
        </label>
        <label>%15
            <input name="pct15" id="pct15" placeholder="0" value="{{ fmt_num(entry.pct15) }}">
        </label>
        <label>Pazar
            <input name="pazar" id="pazar" placeholder="0" value="{{ fmt_num(entry.pazar) }}">
        </label>
        <label>Bayram
            <input name="bayram" id="bayram" placeholder="0" value="{{ fmt_num(entry.bayram) }}">
        </label>
        <label class="full">Açıklama
            <input name="description" placeholder="Açıklama" value="{{ entry.description }}">
        </label>
        <div class="full edit-actions">
            <a class="button-link danger-link" href="{{ url_for('reports' if back == 'reports' else 'dashboard') }}">İptal</a>
            <button class="success-btn" type="submit">Güncelle</button>
        </div>
    </form>
</div>

<script>
function toMinutes(hhmm) {
    if (!hhmm || !hhmm.includes(":")) return null;
    const [h, m] = hhmm.split(":").map(Number);
    if (Number.isNaN(h) || Number.isNaN(m)) return null;
    return h * 60 + m;
}
function minutesToHhmm(totalMin) {
    let m = ((totalMin % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60);
    const mm = m % 60;
    return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}
function parseHours(text) {
    if (text === null || text === undefined) return null;
    const t = String(text).trim().replace(",", ".");
    if (!t) return null;
    const n = Number(t);
    if (Number.isNaN(n)) return null;
    return n;
}
function applyDefaults() {
    const d = document.getElementById("work_date").value;
    if (!d) return;
    fetch(`/api/day-defaults?date=${encodeURIComponent(d)}`)
        .then(r => r.json())
        .then(v => {
            document.getElementById("start_time").value = v.start || "";
            document.getElementById("end_time").value = v.end || "";
            document.getElementById("pct60").value = formatOut(v.pct60);
            document.getElementById("pct15").value = formatOut(v.pct15);
            document.getElementById("pazar").value = formatOut(v.pazar);
            document.getElementById("bayram").value = formatOut(v.bayram);
        })
        .catch(() => {});
}
function formatOut(v){
    if (v === null || v === undefined) return "";
    const n = Number(v);
    if (Math.abs(n) < 1e-9) return "";
    if (Number.isInteger(n)) return String(n);
    return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
}
function recalc() {
    const d = document.getElementById("work_date").value;
    const end = document.getElementById("end_time").value;
    const st = document.getElementById("start_time").value;
    if (!d || !end) return;
    fetch(`/api/day-defaults?date=${encodeURIComponent(d)}&endTime=${encodeURIComponent(end)}&startTime=${encodeURIComponent(st || "")}`)
        .then(r => r.json())
        .then(v => {
            document.getElementById("pct60").value = formatOut(v.pct60);
            document.getElementById("pct15").value = formatOut(v.pct15);
            document.getElementById("pazar").value = formatOut(v.pazar);
            document.getElementById("bayram").value = formatOut(v.bayram);
        })
        .catch(() => {});
}
function on60Changed() {
    const d = document.getElementById("work_date").value;
    const start = document.getElementById("start_time").value;
    const h = parseHours(document.getElementById("pct60").value);
    if (!d || !start || h === null || h <= 0) return;
    const sMin = toMinutes(start);
    if (sMin === null) return;
    fetch(`/api/day-defaults?date=${encodeURIComponent(d)}`)
        .then(r => r.json())
        .then(v => {
            if (v.isHoliday || v.weekday === 6) return;
            const breakH = (v.weekday === 5) ? 1.0 : 0.0;
            const endMin = sMin + Math.round((h + breakH) * 60);
            document.getElementById("end_time").value = minutesToHhmm(endMin);
            recalc();
        })
        .catch(() => {});
}
document.getElementById("work_date").addEventListener("change", applyDefaults);
document.getElementById("start_time").addEventListener("change", recalc);
document.getElementById("end_time").addEventListener("change", recalc);
document.getElementById("pct60").addEventListener("change", on60Changed);
document.getElementById("pct60").addEventListener("input", on60Changed);
(function bindPickerOnlyInputs(root) {
    root.querySelectorAll(".picker-only-dt").forEach((el) => {
        el.addEventListener("keydown", (e) => {
            if (e.key === "Tab" || e.key === "Escape" || e.key === "Enter") return;
            if (e.key && e.key.startsWith("Arrow")) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            e.preventDefault();
        });
        el.addEventListener("paste", (e) => e.preventDefault());
        el.addEventListener("focus", () => {
            try {
                if (typeof el.showPicker === "function") el.showPicker();
            } catch (_e) {}
        });
    });
})(document);
</script>
{% endblock %}
